services:
  postgres:
    image: postgres:18.1-alpine
    environment:
      POSTGRES_USER: jungle
      POSTGRES_PASSWORD: jungle
      POSTGRES_DB: jungle
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jungle -d jungle"]
      interval: 5s
      timeout: 3s
      retries: 10
  postgres-test:
    image: postgres:18.1-alpine
    profiles: ["test"]
    environment:
      POSTGRES_USER: jungle
      POSTGRES_PASSWORD: jungle
      POSTGRES_DB: jungle_test
    ports:
      - "127.0.0.1:5433:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jungle -d jungle_test"]
      interval: 2s
      timeout: 3s
      retries: 15
  app:
    build: .
    environment:
      DATABASE_URL: postgresql://jungle:jungle@postgres:5432/jungle
      PORT: 3000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres_data:
