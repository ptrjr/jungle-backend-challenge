services:
  postgres:
    image: postgres:18.1-alpine
    environment:
      POSTGRES_USER: jungle
      POSTGRES_PASSWORD: jungle
      POSTGRES_DB: jungle
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jungle -d jungle"]
      interval: 5s
      timeout: 3s
      retries: 10
  postgres-test:
    image: postgres:18.1-alpine
    profiles: ["test"]
    environment:
      POSTGRES_USER: jungle
      POSTGRES_PASSWORD: jungle
      POSTGRES_DB: jungle_test
    ports:
      - "127.0.0.1:5433:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jungle -d jungle_test"]
      interval: 2s
      timeout: 3s
      retries: 15
  app:
    build: .
    stop_grace_period: 45s
    environment:
      DATABASE_URL: postgresql://jungle:jungle@postgres:5432/jungle
      PORT: 3000
      MESSAGING_ENABLED: "true"
      SQS_ENDPOINT: http://localstack:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      sqs-init:
        condition: service_completed_successfully
  localstack:
    image: localstack/localstack:4.10.0
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: us-east-1
      SQS_ENDPOINT_STRATEGY: path
      PERSISTENCE: "1"
    ports:
      - "127.0.0.1:4566:4566"
    volumes:
      - localstack_data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "awslocal", "sqs", "list-queues"]
      interval: 3s
      timeout: 5s
      retries: 30
  sqs-init:
    image: localstack/localstack:4.10.0
    entrypoint: ["bash", "/scripts/init-sqs.sh"]
    environment:
      SQS_ENDPOINT: http://localstack:4566
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    volumes:
      - ./scripts/init-sqs.sh:/scripts/init-sqs.sh:ro
    depends_on:
      localstack:
        condition: service_healthy
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    profiles: ["test"]
    ports:
      - "127.0.0.1:8474:8474"
      - "127.0.0.1:8666:8666"
      - "127.0.0.1:8667:8667"
volumes:
  postgres_data:
  localstack_data:
